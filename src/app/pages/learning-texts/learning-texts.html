@if (loading()) {
<app-spinner></app-spinner>
} @else if (errorMessage()) {
<p>{{ errorMessage() }}</p>
} @else {
<section class="learning-texts">
    <mat-accordion>
        @for (item of learningTexts(); track item.id) {
        <mat-expansion-panel class="learning-texts__panel">
            <mat-expansion-panel-header class="learning-texts__header">
                <mat-panel-title class="learning-texts__heading">
                    <span class="learning-texts__title">
                        {{ item.title }}
                    </span>
                    <span class="learning-texts__description">
                        {{ item.description }}
                    </span>
                </mat-panel-title>
            </mat-expansion-panel-header>
            <mat-tab-group mat-stretch-tabs="false" mat-align-tabs="start">
                <mat-tab label="Deutsch">
                    <div class="learning-texts__text">{{ item.text }}</div>
                </mat-tab>
                <mat-tab label="Übersetzung">
                    <div class="learning-texts__text">{{ item.translation }}</div>
                </mat-tab>
            </mat-tab-group>
        </mat-expansion-panel>
        } @empty {
        <p>Noch keine Texte vorhanden.</p>
        }
    </mat-accordion>
</section>
}
