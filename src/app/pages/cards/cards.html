<section class="cards">
    <div class="cards__scene">
        <mat-card class="cards-card" [class.cards-card--flipped]="showAnswer()" (click)="showTranslation()">
            <div class="cards-card__face cards-card__front">
                <mat-card-title class="cards-card__title">
                    {{cards[cardIndex()].de}}
                </mat-card-title>
                <button matIconButton type="button" class="cards__sound"
                    (click)="speakWord($event, cards[cardIndex()].de)">
                    <mat-icon>volume_up</mat-icon>
                </button>
            </div>
            <div class="cards-card__face cards-card__back">
                <mat-card-title class="cards-card__title">
                    {{cards[cardIndex()].translatedText}}
                </mat-card-title>
            </div>
        </mat-card>
    </div>
    <app-cards-controls [cardIndex]="cardIndex()" [visibleCardNumbers]="visibleCardNumbers()"
        [totalCards]="cards.length" (previous)="prevCard()" (next)="nextCard()" />
</section>
