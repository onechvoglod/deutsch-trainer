<header class="app-header">
    <mat-toolbar class="app-toolbar">
        <a routerLink="/" class="app-toolbar__brand">
            <img src="/images/logo.png" alt="Deutsch Trainer" class="app-toolbar__logo" />
            <span class="app-toolbar__title">Deutsch Trainer</span>
        </a>
        <span class="app-header__spacer"></span>
        <button mat-icon-button class="header__account-button" [matMenuTriggerFor]="accountMenu">
            <mat-icon>person</mat-icon>
        </button>
        <mat-menu #accountMenu="matMenu" xPosition="before">
            @if (authService.user(); as user) {
            <div class="app-header__user-name">
                <mat-icon>person_check</mat-icon>
                <span>{{user.displayName ?? 'Benutzer'}}</span>
            </div>
            <mat-divider class="app-header__menu-divider"></mat-divider>
            <button mat-menu-item (click)="logout()">
                <mat-icon>logout</mat-icon>
                <span>Abmelden</span>
            </button>
            } @else {
            <button mat-menu-item (click)="login()">
                <mat-icon>login</mat-icon>
                <span>Mit Google anmelden</span>
            </button>
            }
        </mat-menu>
    </mat-toolbar>
</header>
